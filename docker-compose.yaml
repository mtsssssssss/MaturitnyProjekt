services:
  postgres:
    image: postgres:19
    container_name: MaturitnyProjektPostgresDb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: MaturitnyProjekt
    ports:
      - "9999:5432"
    volumes:
      - MaturitnyProjektPostgresDbVolume:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: MaturitnyProjektPgAdmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8888:80"

volumes:
  MaturitnyProjektPostgresDbVolume: